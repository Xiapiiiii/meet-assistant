<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>API 设置 · Meet 会议助手</title><link rel="stylesheet" href="panel.css"><link rel="stylesheet" href="options.css"></head><body>
<main><h1>API 设置</h1>
<form id="settings">
<section><label for="speech">豆包语音 API Key</label>
<div class="key-field"><input id="speech" disabled type="password" autocomplete="off" spellcheck="false" maxlength="1024"><button type="button" disabled id="speech-eye" aria-label="显示豆包语音密钥" title="显示豆包语音密钥"><img src="icons/eye.svg" alt=""></button></div></section>
<div id="speech-quota"></div><a href="https://console.volcengine.com/speech/new/setting/activate" target="_blank" rel="noopener">语音资源与预警配置</a>
<section><label for="ark">火山方舟 API Key</label>
<div class="key-field"><input id="ark" disabled type="password" autocomplete="off" spellcheck="false" maxlength="1024"><button type="button" disabled id="ark-eye" aria-label="显示火山方舟密钥" title="显示火山方舟密钥"><img src="icons/eye.svg" alt=""></button></div></section>
<div id="ark-quota"></div><a href="https://console.volcengine.com/ark/region:cn-beijing/openManagement" target="_blank" rel="noopener">方舟模型额度</a>
<p class="quota-tools"><button type="button" id="refresh" disabled>刷新额度</button> <small id="checked" role="status"></small></p>
<button id="save" disabled>保存</button><p role="status" id="message"></p>
</form></main><script type="module" src="options.js"></script></body></html>

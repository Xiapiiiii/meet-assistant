<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>API 设置 · Meet 会议助手</title><link rel="stylesheet" href="panel.css"><link rel="stylesheet" href="options.css"></head><body>

<button id="save" disabled>保存</button><p role="status" id="message"></p>
</form></main><script type="module" src="options.js"></script></body></html>
